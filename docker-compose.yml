# SPEC §9: the whole thing with one command.
#
#   docker compose up --build
#
# then the application is on http://localhost:3000, the API on http://localhost:8080/api
# and Postgres on 5432. Seed the demo with:
#
#   node ledger-web/scripts/generate-demo-data.mjs
#
# Exposing this to the internet? Bind the published ports to loopback, put a TLS
# terminator in front, and turn on read-only mode. deploy/ has a worked example.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      # Host ports are overridable so the stack can come up on a machine that already
      # has something on 5432 or 8080: LEDGER_DB_PORT=5433 LEDGER_PORT=8090 docker compose up
      - "${LEDGER_DB_PORT:-5432}:5432"
    volumes:
      - ledger-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Bounded so nothing here can take the host down with it. Tune upward for a real
    # workload; these suit a demo and a laptop.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  app:
    build:
      context: .
      dockerfile: ledger-app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      LEDGER_DB_URL: jdbc:postgresql://db:5432/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ledger
      # Set true when exposing this to the internet: refuses writes, and uploaded
      # statements are parsed and discarded rather than stored.
      LEDGER_DEMO_READ_ONLY: ${LEDGER_DEMO_READ_ONLY:-false}
      # Optional: without it the app still starts and reports nominal figures only (SPEC §6.1).
      EVDS_API_KEY: ${EVDS_API_KEY:-}
    ports:
      - "${LEDGER_PORT:-8080}:8080"
    restart: unless-stopped
    # The JVM sizes its heap from the container limit, so this is the whole budget for
    # parsing whatever a visitor uploads.
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: ledger-web/Dockerfile
      args:
        # Interface language of the built bundle: en (default here) or tr.
        VITE_LOCALE: ${LEDGER_LOCALE:-en}
        VITE_DEMO_MODE: ${LEDGER_DEMO_MODE:-true}
    depends_on:
      - app
    ports:
      - "${LEDGER_WEB_PORT:-3000}:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true

volumes:
  ledger-db:
