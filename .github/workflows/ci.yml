name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The PostgreSQL integration tests skip themselves when there is no Docker
      # daemon, so this asserts the runner has one and a skip cannot pass unnoticed.
      - name: Check Docker is available for Testcontainers
        run: docker info > /dev/null

      # `verify` runs, in order: the module boundary check (Maven Enforcer fails the
      # build if Spring or JPA reaches ledger-core or ledger-import), unit, property
      # and Testcontainers integration tests, the google-java-format check, and
      # SpotBugs.
      - name: Build, test and analyse
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Fail if the integration tests were skipped
        run: |
          if grep -rl 'skipped="[1-9]' ledger-app/target/surefire-reports/*.xml 2>/dev/null; then
            echo "Integration tests were skipped on a runner that has Docker." >&2
            exit 1
          fi

      # SPEC §9: the frontend is typechecked, linted and built on every push.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ledger-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ledger-web

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: ledger-web

      - name: Lint frontend
        run: npm run lint
        working-directory: ledger-web

      - name: Build frontend
        run: npm run build
        working-directory: ledger-web

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore
