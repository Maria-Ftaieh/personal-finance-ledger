# Included inside nginx's http{} block, so the zone declarations below are in the right
# context. This container is the only thing in front of the application, and on a public
# deployment it is what stands between the internet and a PDF parser.

# The real client address. nginx sees the Docker gateway, not the visitor, so without this
# every rate limit below would be one shared bucket for the entire internet. Caddy sets
# X-Forwarded-For, and the published port is bound to loopback so nothing but Caddy can
# reach us — which is what makes trusting the header safe here.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Reading is cheap but the frontend is chatty: opening the detailed view fires about twenty
# requests at once, twelve of them the months of the trend chart. The burst has to clear
# that comfortably or an ordinary page load trips its own limit.
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

# Uploading is the expensive path — it runs a PDF parser over bytes a stranger chose — so
# it gets its own, much tighter bucket.
limit_req_zone $binary_remote_addr zone=upload:10m rate=6r/m;

limit_req_zone $binary_remote_addr zone=static:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# 503 is a lie: the server is fine, the caller is going too fast.
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing downstream needs to know the version, or that it is nginx at all.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    limit_conn conn 24;

    # A statement upload is the only large body this accepts. Anything bigger is refused
    # before it reaches the application, let alone the parser.
    client_max_body_size 20m;
    client_body_timeout 20s;
    client_header_timeout 10s;
    send_timeout 30s;

    # Defence in depth: Caddy sets these too, but this container should be safe to expose
    # on its own rather than relying on something in front of it being configured right.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The application loads no third-party anything: no CDN, no fonts, no analytics.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;

    # The upload endpoint, kept ahead of the general /api rule so it wins.
    location = /api/statements {
        limit_req zone=upload burst=3 nodelay;
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://app:8080;
        include /etc/nginx/proxy-app.conf;
    }

    # The API is proxied rather than called cross-origin, so the browser sees one origin
    # and nothing needs CORS. This is also what the Vite dev server does, which keeps
    # development and the deployed demo behaving the same way.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://app:8080;
        include /etc/nginx/proxy-app.conf;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy is invisible.
    location /assets/ {
        limit_req zone=static burst=100 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        limit_req zone=static burst=100 nodelay;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    }
}
