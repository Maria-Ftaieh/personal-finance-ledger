spring:
  application:
    name: ledger

  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}

  jpa:
    # SPEC §5.1: never more than validate. Every schema change is a numbered Flyway
    # migration, including the seed data, so the schema in the database and the schema in
    # the repository can never drift apart without the application refusing to start.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  error:
    include-message: always

logging:
  level:
    dev.ledger: INFO
