spring:
  application:
    name: ledger

  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}

  jpa:
    # SPEC §5.1: never more than validate. Every schema change is a numbered Flyway
    # migration, including the seed data, so the schema in the database and the schema in
    # the repository can never drift apart without the application refusing to start.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

ledger:
  evds:
    # SPEC §6.1: verified against the live service on 2026-09-04. The pre-2026 address
    # evds2.tcmb.gov.tr/service/evds/ answers 302 to a single-page app and is gone.
    base-url: https://evds3.tcmb.gov.tr/igmevdsms-dis/fe
    # CPI general index, 2003=100. Not TP.FG.J0, which returns the identical figures but
    # stopped at 2026-01; see V5__Seed_cpi_history for the comparison.
    series-code: TP.GENENDEKS.T1
    # Header, never a query parameter. Absent is fine: the application runs on seeded data.
    api-key: ${EVDS_API_KEY:}
    enabled: true
    timeout: 30s

server:
  error:
    include-message: always

logging:
  level:
    dev.ledger: INFO
